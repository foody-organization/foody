<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>게시글 작성/수정</title>
</head>
<body>
<h1 id="pageTitle">게시글 작성</h1>

<label>제목: <input type="text" id="title" /></label><br />
<label>내용: <textarea id="content"></textarea></label><br />
<label>작성자: <input type="text" id="mem" /></label><br />

<button onclick="submit()">저장</button>
<button onclick="location.href='board.html'">목록으로</button>

<script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    if (id) {
        // 수정 모드: 기존 데이터 불러오기
        document.getElementById("pageTitle").innerText = "게시글 수정";

        fetch(`/api/board/${id}`)
            .then(res => res.json())
            .then(post => {
                document.getElementById("title").value = post.title;
                document.getElementById("content").value = post.content;
                document.getElementById("mem").value = post.mem;
            });
    }

    function submit() {
        const postData = {
            title: document.getElementById("title").value,
            content: document.getElementById("content").value,
            mem: document.getElementById("mem").value
        };

        const url = id ? `/api/board/${id}` : `/api/board`;
        const method = id ? "PUT" : "POST";

        fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(postData)
        })
        .then(res => {
            if (!res.ok) throw new Error("저장 실패");
            alert(id ? "수정 완료!" : "등록 완료!");
            location.href = "board.html";
        })
        .catch(err => alert("에러: " + err.message));
    }
</script>
</body>
</html>
