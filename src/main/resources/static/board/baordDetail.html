<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>게시글 상세</title>
</head>
<body>
<h1>게시글 상세</h1>

<div>
    <p><strong>ID:</strong> <span id="id"></span></p>
    <p><strong>제목:</strong> <span id="title"></span></p>
    <p><strong>내용:</strong></p>
    <div id="content" style="border:1px solid #ccc; padding:10px;"></div>
    <p><strong>작성자:</strong> <span id="mem"></span></p>
</div>

<hr />

<button onclick="goEdit()">수정</button>
<button onclick="goList()">목록</button>

<script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    if (!id) {
        alert("잘못된 접근입니다.");
        location.href = "board.html";
    }

    // 게시글 조회
    fetch(`/api/board/${id}`)
        .then(res => {
            if (!res.ok) throw new Error("게시글 조회 실패");
            return res.json();
        })
        .then(data => {
            document.getElementById("id").innerText = data.id;
            document.getElementById("title").innerText = data.title;
            document.getElementById("content").innerText = data.content;
            document.getElementById("mem").innerText = data.mem;
        })
        .catch(err => {
            alert("게시글을 불러올 수 없습니다.");
            console.error(err);
            location.href = "board.html";
        });

    function goEdit() {
        location.href = `boardEdit.html?id=${id}`;
    }

    function goList() {
        location.href = "board.html";
    }
</script>
</body>
</html>
