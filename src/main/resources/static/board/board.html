<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>게시글 목록</title>
</head>
<body>
<h1>게시판 목록</h1>
<button onclick="location.href='boardEdit.html'">글 작성</button>

<table border="1" id="postTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>제목</th>
        <th>내용</th>
        <th>작성자</th>
        <th>등록시간</th>
    </tr>
    </thead>
    <tbody id="postBody">
    </tbody>
</table>

<script>
    function loadPosts() {
        fetch('/api/board')  // 컨트롤러 경로에 맞게 수정하세요
            .then(res => res.json())
            .then(posts => {
                const tbody = document.getElementById('postBody');
                tbody.innerHTML = ''; // 초기화
                posts.forEach(post => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${post.id}</td>
                        <td><a href="/board/baordDetail.html?id=${post.id}">${post.title}</a></td>
                        <td>${post.content}</td>
                        <td>${post.mem}</td>
                        <td>${post.createDate}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => {
                alert('게시글 조회 실패');
                console.error(err);
            });
    }

    // 페이지가 모두 로드되면 바로 호출
    window.onload = loadPosts;
</script>
</body>
</html>
