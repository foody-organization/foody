<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <!-- map.html -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a4bb6cf445275bc0b830319b34701b7d&libraries=services&autoload=false"></script>
    <script th:src="@{/script.js}"></script>

    <title>카카오 지도 예제</title>
</head>
<body>
<div class="map_wrap">
    <div id="map" style="width:100%;height:100%;position:relative;overflow:hidden;"></div>
    <div id="menu_wrap" class="bg_white">
        <div class="option">
            <form onsubmit="searchPlaces(); return false;">
                키워드 : <input type="text"  placeholder="검색어를 입력하세요" id="keyword" size="15"/>
                <button type="submit">검색하기</button>
            </form>
        </div>
        <hr>
        <ul id="placesList"></ul>
        <div id="pagination"></div>
    </div>
</div>
<div id="test-div" class="info-panel"></div>
<!-- 리뷰 패널(기본은 숨김) -->
<div id="review-panel" style="display:none; max-height:380px; overflow:auto; border:1px solid #ddd; padding:12px; border-radius:8px;">
    <h3 id="review-place-title">리뷰</h3>

    <ul id="review-list" style="list-style:none; padding-left:0; margin:8px 0;"></ul>

    <hr style="margin:12px 0;">

    <form onsubmit="return submitReview();">
        <!-- 선택된 식당 정보(숨김) -->
        <input type="hidden" id="review-placeId">
        <input type="hidden" id="review-placeName">
        <input type="hidden" id="review-address">

        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <input id="review-nickname" placeholder="닉네임" required style="flex:1; min-width:120px;">
            <select id="review-rating" required>
                <option value="5">⭐ 5</option>
                <option value="4">⭐ 4</option>
                <option value="3">⭐ 3</option>
                <option value="2">⭐ 2</option>
                <option value="1">⭐ 1</option>
            </select>
            <button type="submit">리뷰 등록</button>
            <button type="button" onclick="closeReviewPanel()">닫기</button>
        </div>

        <textarea id="review-content" rows="3" placeholder="리뷰 내용을 입력하세요" required
                  style="width:100%; margin-top:8px;"></textarea>
    </form>
</div>


</body>
</html>
